########################
# Device Setup
########################

substitutions:
  device_id: pump-supply
  device_name: Pump Supply

esphome:
  name: "${device_id}"
  friendly_name: "${device_name}"

esp32:
  board: nodemcu-32s
  framework:
    type: arduino

########################
# Software Stack Setup
########################

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption

# Enable Over-The-Air Updates
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: ${device_name} Hotspot
    password: !secret wifi_fallback_password

captive_portal:

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"

sensor:

  # Extra sensor to keep track of plug uptime
  - platform: uptime
    name: "Uptime"
    filters:
      - lambda: return x / 3600;
    unit_of_measurement: "h"
    accuracy_decimals: 2

  # Extra sensor for WiFi signal
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

########################
# Hardware Setup
########################

status_led:
  pin:
    number: GPIO23
    inverted: true

binary_sensor:

  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: True
    name: "Button"
    on_press:
      then:
        - switch.toggle: id_relay

switch:
  - platform: gpio
    name: "Relay"
    pin: GPIO16
    id: id_relay
    restore_mode: ALWAYS_OFF















# =============================================================================
#  WATER PUMP CONTROLLER  —  ESP32 custom board
#  Base configuration: I/O map, debouncing, fault detection.
#  Control logic is NOT yet implemented — the relay is defined but undriven.
# =============================================================================
#
#  SYSTEM
#    Hydropneumatic set. The pump draws from the storage tank and pressurises
#    the system; a PRESSURE SWITCH performs the actual cycling. The storage
#    tank is refilled by a mechanical float valve — this controller does not
#    fill anything.
#
#    R1 is therefore a PERMISSIVE, not a run command. A closed relay only
#    means the pump is ALLOWED to run; the pressure switch decides whether it
#    does. This controller has no feedback on actual motor rotation.
#
#  INTENDED OPERATION
#    AUTO : permit while S2 (empty) is released.
#           S1 (full) is informational only and never gates the relay.
#    ON   : permit unconditionally, both floats ignored. Used when the tank
#           is bypassed and the pump feeds from utility water directly.
#    OFF  : selector centre position (neither M1 nor M2 asserted).
#    Any mode: T2 (overload tripped) drops the permissive.
#    The overload relay is configured for MANUAL reset, so a trip stays
#    latched in hardware until someone presses it. No software lockout or
#    restart cooldown is needed.
#
# -----------------------------------------------------------------------------
#  WIRING
# -----------------------------------------------------------------------------
#  POWER
#    GND    Black    System ground
#    VCC    Red      +24 VDC system power input
#    DGND   -        System digital ground (unused)
#    VDD    Yellow   +3.3 VDC internal regulator -> status LED common anode
#
#  RELAY (pump contactor coil)
#    NC     -        Not connected
#    COM    Red      +24 VDC contactor coil supply
#    NO     Blue     Contactor coil
#
#  IO   (all inputs are ACTIVE LOW, internal pull-up, inverted in software)
#
#  Label GPIO  Dir  Pull      Wire          Asserted (pin LOW) means
#  ----- ----  ---  --------  ------------  ------------------------------------
#  S1    4     IN   pull-up   White (TSJ)   Float in FULL position
#  S2    26    IN   pull-up   Green (TSJ)   Float in EMPTY position
#  M1    14    IN   pull-up   Green         Selector in ON position
#  M2    13    IN   pull-up   White         Selector in AUTO position
#  T1    17    IN   pull-up   Green         Overload aux NC closed  -> healthy
#  T2    18    IN   pull-up   White         Overload aux NO closed  -> tripped
#  R1    16    OUT  ext. pd   -             HIGH = energise contactor coil
#
#  T1/T2 are the NC and NO halves of the same auxiliary block; they must
#  always read complementary. T1 == T2 indicates a broken wire, an unplugged
#  connector, or a contact caught mid-travel.
# =============================================================================

substitutions:
  device_name: pump-controller
  device_friendly: "Pump Controller"

  # --- Pin map (see wiring table above) ---
  pin_s1_float_full:   GPIO4
  pin_s2_float_empty:  GPIO26
  pin_m1_mode_on:      GPIO14
  pin_m2_mode_auto:    GPIO13
  pin_t1_overload_ok:  GPIO17
  pin_t2_overload_flt: GPIO18
  pin_r1_pump_relay:   GPIO16

  # --- Debounce windows ---
  # Floats get the longest window: they chatter mechanically with water
  # movement, and the TSJ runs share space with a 24 VDC contactor coil.
  debounce_float:    2000ms
  debounce_selector: 200ms
  debounce_overload: 100ms

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly}
  on_boot:
    # Highest practical priority: assert the relay LOW before anything else
    # runs. The external pull-down already covers the window before this,
    # but this makes the intent explicit and survives a soft reset.
    - priority: 800
      then:
        - output.turn_off: r1_pump_relay_output
    # Once the stack is up, evaluate for real. refresh_control refuses to
    # permit until every critical input reports has_state(), so it is safe
    # to call before the debounce windows have elapsed.
    - priority: 250
      then:
        - script.execute: refresh_control

esp32:
  # NOTE: GPIO16/17 are consumed by PSRAM on WROVER modules. This config
  # assumes a WROOM-32 or any other module WITHOUT PSRAM.
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  # A pump controller must never reboot itself because Home Assistant went
  # away. All control logic is local; HA is an observer only.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Same reasoning as api.reboot_timeout — never reboot mid pump cycle
  # because of an AP outage.
  reboot_timeout: 0s
  ap:
    ssid: "${device_friendly} Fallback"
    password: !secret ap_password

# =============================================================================
#  INPUTS
# =============================================================================

binary_sensor:
  # --- S1 : float, tank FULL ------------------------------------------------
  - platform: gpio
    id: s1_float_full
    name: "Float Full"
    pin:
      number: ${pin_s1_float_full}
      mode:
        input: true
        pullup: true
      inverted: true          # pin LOW = float in full position = state true
    filters:
      - delayed_on: ${debounce_float}
      - delayed_off: ${debounce_float}

  # --- S2 : float, tank EMPTY -----------------------------------------------
  - platform: gpio
    id: s2_float_empty
    name: "Float Empty"
    pin:
      number: ${pin_s2_float_empty}
      mode:
        input: true
        pullup: true
      inverted: true          # pin LOW = float in empty position = state true
    filters:
      - delayed_on: ${debounce_float}
      - delayed_off: ${debounce_float}
    on_state:
      - script.execute: refresh_control

  # --- M1 : selector in ON --------------------------------------------------
  - platform: gpio
    id: m1_mode_on
    name: "Selector ON"
    pin:
      number: ${pin_m1_mode_on}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: ${debounce_selector}
      - delayed_off: ${debounce_selector}
    on_state:
      - script.execute: refresh_control

  # --- M2 : selector in AUTO ------------------------------------------------
  - platform: gpio
    id: m2_mode_auto
    name: "Selector AUTO"
    pin:
      number: ${pin_m2_mode_auto}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: ${debounce_selector}
      - delayed_off: ${debounce_selector}
    on_state:
      - script.execute: refresh_control

  # --- T1 : overload auxiliary NC (closed = healthy) ------------------------
  - platform: gpio
    id: t1_overload_ok
    name: "Overload Contact OK"
    pin:
      number: ${pin_t1_overload_ok}
      mode:
        input: true
        pullup: true
      inverted: true          # pin LOW = NC closed = not tripped
    filters:
      - delayed_on: ${debounce_overload}
      - delayed_off: ${debounce_overload}

  # --- T2 : overload auxiliary NO (closed = tripped) ------------------------
  - platform: gpio
    id: t2_overload_fault
    name: "Overload Tripped"
    device_class: problem
    pin:
      number: ${pin_t2_overload_flt}
      mode:
        input: true
        pullup: true
      inverted: true          # pin LOW = NO closed = tripped
    filters:
      - delayed_on: ${debounce_overload}
      - delayed_off: ${debounce_overload}
    on_state:
      - script.execute: refresh_control

  # ===========================================================================
  #  DERIVED STATE / IMPOSSIBLE-COMBINATION DETECTORS
  # ===========================================================================

  # T1 and T2 are complementary halves of one aux block. Equal readings mean
  # a broken wire, an unplugged connector, or a contact mid-travel. The delay
  # tolerates the genuine transition window.
  - platform: template
    id: overload_feedback_fault
    name: "Overload Feedback Fault"
    device_class: problem
    lambda: |-
      return id(t1_overload_ok).state == id(t2_overload_fault).state;
    filters:
      - delayed_on: 1s

  # A tank cannot be full and empty at once.
  - platform: template
    id: float_fault
    name: "Float Fault"
    device_class: problem
    lambda: |-
      return id(s1_float_full).state && id(s2_float_empty).state;
    filters:
      - delayed_on: 3s

  # A break-before-make selector cannot bridge two positions.
  - platform: template
    id: selector_fault
    name: "Selector Fault"
    device_class: problem
    lambda: |-
      return id(m1_mode_on).state && id(m2_mode_auto).state;
    filters:
      - delayed_on: 1s

  # Read-only mirror of the relay output. This is the PERMISSIVE state, not
  # motor rotation — the pressure switch downstream decides whether the pump
  # actually turns, and nothing on this board can observe that.
  - platform: template
    id: pump_enabled
    name: "Pump Enabled"
    icon: mdi:water-pump
    lambda: |-
      return id(pump_contactor).state;

text_sensor:
  - platform: template
    id: mode_selector_state
    name: "Mode Selector"
    icon: mdi:tune-variant
    update_interval: never

  # Why the pump is or is not permitted right now. Saves walking out to the
  # shed to figure out which interlock is holding it off.
  - platform: template
    id: permissive_reason
    name: "Permissive Reason"
    icon: mdi:information-outline
    update_interval: never

# =============================================================================
#  OUTPUT  —  R1, pump contactor coil
# =============================================================================
#  Not driven by anything yet. `pump_contactor` is internal so Home Assistant
#  cannot bypass the (forthcoming) interlocks; the control logic will own it.

output:
  - platform: gpio
    id: r1_pump_relay_output
    pin:
      number: ${pin_r1_pump_relay}
      mode:
        output: true

switch:
  - platform: output
    id: pump_contactor
    output: r1_pump_relay_output
    internal: true
    # Never resurrect a previous ON state across a reboot or brownout.
    restore_mode: ALWAYS_OFF

# =============================================================================
#  SCRIPTS
# =============================================================================

script:
  # ---------------------------------------------------------------------------
  #  SOLE OWNER OF THE PUMP PERMISSIVE.
  #  Nothing else in this config writes to `pump_contactor`. Invoked on every
  #  relevant input change, on boot, and every 5 s as a resync.
  #
  #  PERMIT =  no overload trip
  #        AND selector in a valid single position
  #        AND ( ON   -> unconditional
  #            | AUTO -> tank not empty )
  #
  #  Design notes:
  #   * S1 (full) is informational and appears nowhere in this expression.
  #   * float_fault (both floats asserted) needs no special case — S2 is
  #     asserted in that condition, so AUTO inhibits on its own.
  #   * overload_feedback_fault with BOTH contacts open (broken wire, pulled
  #     connector) alarms but deliberately does NOT inhibit. The overload
  #     device protects the motor by breaking the motor circuit itself, so
  #     losing the auxiliary signal costs observability, not protection —
  #     and inhibiting would leave the house without water pressure over a
  #     fallen-off signal wire. To reverse that decision, add
  #     `|| id(overload_feedback_fault).state` to the overload test below.
  # ---------------------------------------------------------------------------
  - id: refresh_control
    then:
      - lambda: |-
          const bool sel_on   = id(m1_mode_on).state;
          const bool sel_auto = id(m2_mode_auto).state;

          // ---- mode selector text ----
          std::string mode;
          if      (sel_on && sel_auto) mode = "INVALID";
          else if (sel_on)             mode = "ON";
          else if (sel_auto)           mode = "AUTO";
          else                         mode = "OFF";
          if (id(mode_selector_state).state != mode)
            id(mode_selector_state).publish_state(mode);

          // ---- permissive evaluation ----
          bool permit;
          std::string reason;

          if (!id(m1_mode_on).has_state()     || !id(m2_mode_auto).has_state() ||
              !id(s2_float_empty).has_state() || !id(t2_overload_fault).has_state()) {
            // Inputs still inside their debounce windows. Fail closed.
            permit = false;  reason = "Initialising";
          } else if (id(t2_overload_fault).state) {
            permit = false;  reason = "Overload tripped";
          } else if (sel_on && sel_auto) {
            // Break-before-make selector cannot bridge positions: wiring fault.
            permit = false;  reason = "Selector invalid";
          } else if (sel_on) {
            permit = true;   reason = "Manual ON";
          } else if (sel_auto) {
            permit = !id(s2_float_empty).state;
            reason = permit ? "Auto, permitted" : "Tank empty";
          } else {
            permit = false;  reason = "Selector OFF";
          }

          if (id(permissive_reason).state != reason)
            id(permissive_reason).publish_state(reason);

          if (permit != id(pump_contactor).state) {
            ESP_LOGI("pump", "Permissive %s -> %s (%s)",
                     id(pump_contactor).state ? "ON" : "OFF",
                     permit ? "ON" : "OFF",
                     reason.c_str());
            if (permit) id(pump_contactor).turn_on();
            else        id(pump_contactor).turn_off();
          }

interval:
  # Resync safety net. The permissive is recomputed on every relevant input
  # change, so this should never actually change anything — but it guarantees
  # the relay cannot sit disagreeing with the inputs because of a missed edge.
  - interval: 5s
    then:
      - script.execute: refresh_control

# =============================================================================
#  DIAGNOSTICS
# =============================================================================

sensor:
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

  - platform: wifi_signal
    name: "WiFi Signal"
    entity_category: diagnostic
    update_interval: 60s
